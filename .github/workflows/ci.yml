name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Format & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo test (default features)
        run: cargo test

      - name: cargo test (library only, no CLI)
        run: cargo test --no-default-features

      # Smoke-test the C ABI by compiling and running the example against the
      # freshly built shared library.
      - name: Build shared library
        run: cargo build --release --lib

      - name: C ABI smoke test (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cc -I include examples/c/ilink_demo.c \
             -L target/release -lilink_sdk -o /tmp/ilink_demo
          if [ "${{ runner.os }}" = "macOS" ]; then
            DYLD_LIBRARY_PATH=target/release /tmp/ilink_demo
          else
            LD_LIBRARY_PATH=target/release /tmp/ilink_demo
          fi

      - name: C ABI smoke test (windows, MinGW if present)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command gcc -ErrorAction SilentlyContinue)) {
            Write-Host "gcc not found; skipping the C ABI link test on Windows"
            exit 0
          }
          gcc -I include examples/c/ilink_demo.c target/release/ilink_sdk.dll -o ilink_demo.exe
          Copy-Item target/release/ilink_sdk.dll .
          ./ilink_demo.exe

  bindings:
    name: Language bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build shared library
        run: cargo build --release --lib

      - name: Python bindings
        run: PYTHONPATH=bindings/python python3 bindings/python/tests/test_smoke.py

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache: false

      - name: Go bindings
        working-directory: bindings/go
        run: go test ./...

      - name: C++ bindings
        run: |
          set -euo pipefail
          g++ -std=c++17 -I include bindings/cpp/example.cpp \
              -L target/release -lilink_sdk -o /tmp/ilink_cpp_demo
          LD_LIBRARY_PATH=target/release /tmp/ilink_cpp_demo

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Fetch JNA
        run: curl -sSL -o /tmp/jna.jar https://repo1.maven.org/maven2/net/java/dev/jna/jna/5.14.0/jna-5.14.0.jar

      - name: Java bindings
        run: |
          set -euo pipefail
          mkdir -p /tmp/jout
          javac -cp /tmp/jna.jar -d /tmp/jout \
              $(find bindings/java/src/main/java -name '*.java') \
              bindings/java/examples/Example.java
          java -cp "/tmp/jout:/tmp/jna.jar" -Djna.library.path=target/release Example

      - name: Kotlin bindings
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/kotlinc.zip \
              https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip
          unzip -q /tmp/kotlinc.zip -d /tmp
          /tmp/kotlinc/bin/kotlinc -cp /tmp/jna.jar -d /tmp/kout \
              $(find bindings/kotlin/src/main/kotlin -name '*.kt')
          java -cp "/tmp/kout:/tmp/jna.jar:/tmp/kotlinc/lib/kotlin-stdlib.jar" \
              -Djna.library.path=target/release io.ilink.sdk.ExampleKt

  libraries:
    name: Libraries (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x86_64
            target: x86_64-unknown-linux-gnu
            cross: false
          - os: ubuntu-latest
            artifact: linux-aarch64
            target: aarch64-unknown-linux-gnu
            cross: true
          - os: macos-latest
            artifact: macos-aarch64
            target: aarch64-apple-darwin
            cross: false
          - os: macos-latest
            artifact: macos-x86_64
            target: x86_64-apple-darwin
            cross: false
          - os: windows-latest
            artifact: windows-x86_64
            target: x86_64-pc-windows-msvc
            cross: false
          - os: windows-latest
            artifact: windows-aarch64
            target: aarch64-pc-windows-msvc
            cross: false
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # `cross` (Docker) is used for the non-native Linux target; the macOS and
      # Windows targets are built natively with the runner toolchains.
      - uses: taiki-e/install-action@cross
        if: matrix.cross

      - name: Build release libraries
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Stage artifacts (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          libdir="target/${{ matrix.target }}/release"
          if [ "${{ runner.os }}" = "macOS" ]; then
            # Make the dylib relocatable so it can be bundled into an app.
            install_name_tool -id "@rpath/libilink_sdk.dylib" \
              "$libdir/libilink_sdk.dylib"
            cp "$libdir/libilink_sdk.dylib" dist/
            cp "$libdir/libilink_sdk.a" dist/
          else
            cp "$libdir/libilink_sdk.so" dist/
            cp "$libdir/libilink_sdk.a" dist/
          fi
          cp include/ilink_sdk.h dist/

      - name: Stage artifacts (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $lib = "target/${{ matrix.target }}/release"
          Copy-Item "$lib/ilink_sdk.dll" dist/
          Copy-Item "$lib/ilink_sdk.dll.lib" dist/
          Copy-Item "$lib/ilink_sdk.lib" dist/
          Copy-Item include/ilink_sdk.h dist/

      - uses: actions/upload-artifact@v4
        with:
          name: ilink-sdk-${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
