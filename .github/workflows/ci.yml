name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Format & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo test (default features)
        run: cargo test

      - name: cargo test (library only, no CLI)
        run: cargo test --no-default-features

      # Smoke-test the C ABI by compiling and running the example against the
      # freshly built shared library.
      - name: Build shared library
        run: cargo build --release --lib

      - name: C ABI smoke test (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cc -I include examples/c/ilink_demo.c \
             -L target/release -lilink_sdk -o /tmp/ilink_demo
          if [ "${{ runner.os }}" = "macOS" ]; then
            DYLD_LIBRARY_PATH=target/release /tmp/ilink_demo
          else
            LD_LIBRARY_PATH=target/release /tmp/ilink_demo
          fi

      - name: C ABI smoke test (windows, MinGW if present)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command gcc -ErrorAction SilentlyContinue)) {
            Write-Host "gcc not found; skipping the C ABI link test on Windows"
            exit 0
          }
          gcc -I include examples/c/ilink_demo.c target/release/ilink_sdk.dll -o ilink_demo.exe
          Copy-Item target/release/ilink_sdk.dll .
          ./ilink_demo.exe

  bindings:
    name: Language bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build shared library
        run: cargo build --release --lib

      - name: Version numbers agree across manifests
        run: python3 bindings/scripts/set_version.py --check

      - name: Python bindings
        run: PYTHONPATH=bindings/python python3 bindings/python/tests/test_smoke.py

      - name: Python wheel bundles the native library
        run: |
          set -euo pipefail
          python3 -m pip install --quiet build
          python3 -m build --wheel bindings/python
          python3 - <<'PY'
          import glob, zipfile
          wheel = glob.glob("bindings/python/dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          native = [n for n in names if n.endswith((".so", ".dylib", ".dll"))]
          assert native, f"no native library in {wheel}: {names}"
          print(f"{wheel} bundles {native}")
          PY

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache: false

      # The default build is cgo-free and loads the embedded library at runtime.
      - name: Go bindings (cgo-free)
        working-directory: bindings/go
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          python3 ../scripts/stage_native.py --binding go
          go vet ./...
          go test ./...

      - name: Go bindings (opt-in cgo)
        working-directory: bindings/go
        env:
          CGO_ENABLED: "1"
        run: |
          set -euo pipefail
          go vet -tags ilink_cgo ./...
          go test -tags ilink_cgo ./...

      - name: C++ bindings (CMake package)
        run: |
          set -euo pipefail
          cmake -S bindings/cpp -B /tmp/ilink-cpp -DILINK_SDK_BUILD_EXAMPLE=ON
          cmake --build /tmp/ilink-cpp
          cmake --install /tmp/ilink-cpp --prefix /tmp/ilink-cpp-install
          LD_LIBRARY_PATH=target/release /tmp/ilink-cpp/ilink-cpp-example

      - name: C++ bindings (direct compile)
        run: |
          set -euo pipefail
          g++ -std=c++17 -I include -I bindings/cpp bindings/cpp/example.cpp \
              -L target/release -lilink_sdk -o /tmp/ilink_cpp_demo
          LD_LIBRARY_PATH=target/release /tmp/ilink_cpp_demo

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Fetch JNA
        run: curl -sSL -o /tmp/jna.jar https://repo1.maven.org/maven2/net/java/dev/jna/jna/5.14.0/jna-5.14.0.jar

      - name: Java bindings
        run: |
          set -euo pipefail
          python3 bindings/scripts/stage_native.py --binding java
          mkdir -p /tmp/jout
          javac -cp /tmp/jna.jar -d /tmp/jout \
              $(find bindings/java/src/main/java -name '*.java') \
              bindings/java/examples/Example.java
          cp -r bindings/java/src/main/resources/* /tmp/jout/
          # No -Djna.library.path: the loader must find the bundled library.
          java -cp "/tmp/jout:/tmp/jna.jar" Example

      - name: Kotlin bindings
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/kotlinc.zip \
              https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip
          unzip -q /tmp/kotlinc.zip -d /tmp
          python3 bindings/scripts/stage_native.py --binding kotlin
          mkdir -p /tmp/kout
          /tmp/kotlinc/bin/kotlinc -cp /tmp/jna.jar -d /tmp/kout \
              $(find bindings/kotlin/src/main/kotlin -name '*.kt')
          cp -r bindings/kotlin/src/main/resources/* /tmp/kout/
          # No -Djna.library.path: the loader must find the bundled library.
          java -cp "/tmp/kout:/tmp/jna.jar:/tmp/kotlinc/lib/kotlin-stdlib.jar" \
              io.ilink.sdk.ExampleKt

  libraries:
    name: Libraries (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x86_64
            target: x86_64-unknown-linux-gnu
            cross: false
          - os: ubuntu-latest
            artifact: linux-aarch64
            target: aarch64-unknown-linux-gnu
            cross: true
          - os: macos-latest
            artifact: macos-aarch64
            target: aarch64-apple-darwin
            cross: false
          - os: macos-latest
            artifact: macos-x86_64
            target: x86_64-apple-darwin
            cross: false
          - os: windows-latest
            artifact: windows-x86_64
            target: x86_64-pc-windows-msvc
            cross: false
          - os: windows-latest
            artifact: windows-aarch64
            target: aarch64-pc-windows-msvc
            cross: false
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # `cross` (Docker) is used for the non-native Linux target; the macOS and
      # Windows targets are built natively with the runner toolchains.
      - uses: taiki-e/install-action@cross
        if: matrix.cross

      - name: Build release libraries
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Stage artifacts (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          libdir="target/${{ matrix.target }}/release"
          if [ "${{ runner.os }}" = "macOS" ]; then
            # Make the dylib relocatable so it can be bundled into an app.
            install_name_tool -id "@rpath/libilink_sdk.dylib" \
              "$libdir/libilink_sdk.dylib"
            cp "$libdir/libilink_sdk.dylib" dist/
            cp "$libdir/libilink_sdk.a" dist/
          else
            cp "$libdir/libilink_sdk.so" dist/
            cp "$libdir/libilink_sdk.a" dist/
          fi
          cp include/ilink_sdk.h dist/

      - name: Stage artifacts (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $lib = "target/${{ matrix.target }}/release"
          Copy-Item "$lib/ilink_sdk.dll" dist/
          Copy-Item "$lib/ilink_sdk.dll.lib" dist/
          Copy-Item "$lib/ilink_sdk.lib" dist/
          Copy-Item include/ilink_sdk.h dist/

      - uses: actions/upload-artifact@v4
        with:
          name: ilink-sdk-${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  # Validate everything a release would publish, without publishing. This
  # catches a broken manifest, a crate that does not package cleanly, or a
  # missing native library before a tag is cut.
  packaging:
    name: Packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache: false

      - name: Version numbers agree across manifests
        run: python3 bindings/scripts/set_version.py --check

      - name: The crate packages cleanly
        run: cargo publish --dry-run --allow-dirty

      - name: Python metadata builds
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --upgrade build twine
          python3 -m build --sdist bindings/python
          python3 -m twine check bindings/python/dist/*

      - name: Java POM is valid
        run: mvn -B -f bindings/java/pom.xml help:effective-pom -Doutput=/tmp/effective-pom.xml

      - name: Kotlin build script is valid
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/gradle.zip \
              https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.10.2/bin/gradle -p bindings/kotlin tasks --quiet

      - name: Go module is tidy
        working-directory: bindings/go
        run: |
          set -euo pipefail
          cp go.mod /tmp/go.mod.bak
          cp go.sum /tmp/go.sum.bak
          go mod tidy
          diff -u /tmp/go.mod.bak go.mod
          diff -u /tmp/go.sum.bak go.sum
