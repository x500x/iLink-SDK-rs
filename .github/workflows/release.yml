name: Release

# A tag push (`v*`) builds everything and publishes to every registry
# automatically. A manual run builds the artifacts and only publishes when the
# `publish` input is checked.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Also publish to crates.io / PyPI / Maven Central"
        type: boolean
        default: false

permissions:
  contents: write
  # Required for OIDC trusted publishing to PyPI and crates.io.
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Derive the version from the tag (or Cargo.toml) and make every manifest
  # agree, so the crate, wheels and JARs are all published with the same number.
  prepare:
    name: Prepare version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve and sync the version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            publish=true
          else
            version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
            publish="${{ inputs.publish }}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          python bindings/scripts/set_version.py "$version"
          python bindings/scripts/set_version.py --check
          echo "releasing $version (publish=$publish)"

      # A tag release must not silently publish a different version than the
      # one committed in the tree.
      - name: Fail if the tag and Cargo.toml disagree
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          declared="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          if [ "$declared" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::tag v${{ steps.version.outputs.version }} but Cargo.toml says $declared"
            exit 1
          fi

  libraries:
    name: Libraries (${{ matrix.artifact }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x86_64
            target: x86_64-unknown-linux-gnu
            cross: false
          - os: ubuntu-latest
            artifact: linux-aarch64
            target: aarch64-unknown-linux-gnu
            cross: true
          - os: macos-latest
            artifact: macos-aarch64
            target: aarch64-apple-darwin
            cross: false
          - os: macos-latest
            artifact: macos-x86_64
            target: x86_64-apple-darwin
            cross: false
          - os: windows-latest
            artifact: windows-x86_64
            target: x86_64-pc-windows-msvc
            cross: false
          - os: windows-latest
            artifact: windows-aarch64
            target: aarch64-pc-windows-msvc
            cross: false
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # `cross` (Docker) is used for the non-native Linux target; the macOS and
      # Windows targets are built natively with the runner toolchains.
      - uses: taiki-e/install-action@cross
        if: matrix.cross

      - name: Build release libraries
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Stage artifacts (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          libdir="target/${{ matrix.target }}/release"
          if [ "${{ runner.os }}" = "macOS" ]; then
            # Make the dylib relocatable so it can be bundled into an app.
            install_name_tool -id "@rpath/libilink_sdk.dylib" \
              "$libdir/libilink_sdk.dylib"
            cp "$libdir/libilink_sdk.dylib" dist/
            cp "$libdir/libilink_sdk.a" dist/
          else
            cp "$libdir/libilink_sdk.so" dist/
            cp "$libdir/libilink_sdk.a" dist/
          fi
          cp include/ilink_sdk.h dist/

      - name: Stage artifacts (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $lib = "target/${{ matrix.target }}/release"
          Copy-Item "$lib/ilink_sdk.dll" dist/
          Copy-Item "$lib/ilink_sdk.dll.lib" dist/
          Copy-Item "$lib/ilink_sdk.lib" dist/
          Copy-Item include/ilink_sdk.h dist/

      - uses: actions/upload-artifact@v4
        with:
          name: ilink-sdk-${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  python-wheels:
    name: Python wheel (${{ matrix.artifact }})
    needs: [prepare, libraries]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x86_64
          - os: macos-15-intel
            artifact: macos-x86_64
          - os: macos-latest
            artifact: macos-aarch64
          - os: windows-latest
            artifact: windows-x86_64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: ilink-sdk-${{ matrix.artifact }}
          path: native

      - name: Build the wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade build
          python bindings/scripts/set_version.py "${{ needs.prepare.outputs.version }}"
          # Point setup.py at the library built by the `libraries` job. The path
          # must be absolute: `python -m build` runs the backend with the cwd set
          # to bindings/python, so a relative path would not resolve. Compute it
          # with Python so the result is a native path on every OS (git-bash's
          # /d/... form would not be understood by python.exe on Windows).
          lib=$(python - "$PWD/native" <<'PY'
          import glob, os, sys
          for pattern in ("*.dll", "*.so", "*.dylib"):
              found = glob.glob(os.path.join(sys.argv[1], pattern))
              if found:
                  print(os.path.abspath(found[0]))
                  break
          PY
          )
          test -n "$lib"
          echo "bundling $lib"
          ILINK_SDK_LIB="$lib" python -m build --wheel bindings/python

      - name: Verify the wheel bundles the library
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob, zipfile
          wheel = glob.glob("bindings/python/dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          native = [n for n in names if n.endswith((".so", ".dylib", ".dll"))]
          assert native, f"no native library in {wheel}: {names}"
          # PyPI rejects the generic `linux_x86_64` tag; setup.py derives a
          # PEP 600 `manylinux_x_y` tag from the library's glibc symbols.
          tag = wheel.rsplit("-", 1)[-1].removesuffix(".whl")
          assert not tag.startswith("linux_"), (
              f"{wheel} has the non-portable tag {tag!r}; PyPI will reject it"
          )
          print(f"{wheel} bundles {native}")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.artifact }}
          path: bindings/python/dist/*.whl
          if-no-files-found: error

  # Wheels are built per platform, but only one upload is needed. The PyPI
  # action refuses to run outside Linux, so publishing happens here, in a single
  # Linux job, after every wheel has been built.
  pypi:
    name: Publish to PyPI
    needs: [prepare, python-wheels]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: wheels
          merge-multiple: true

      - name: Show the wheels
        run: ls -la wheels

      - name: Publish to PyPI
        # A registry hiccup must not block the GitHub release, which is what the
        # Go download fallback and the C/C++ archives depend on. The `verify`
        # job reports any publish that did not land.
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: wheels
          skip-existing: true
          # A configured API token wins (required for the very first upload of
          # a new project). With no token the action falls back to trusted
          # publishing (OIDC), which needs the pending publisher on PyPI.
          password: ${{ secrets.PYPI_API_TOKEN }}
          # PEP 740 attestations only work in the trusted-publishing flow.
          attestations: ${{ secrets.PYPI_API_TOKEN == '' }}
          # No token: PyPI trusted publishing (OIDC) authenticates via the
          # `id-token: write` permission. Configure the trusted publisher once
          # at https://pypi.org/manage/account/publishing/ with:
          #   owner=x500x  repo=iLink-SDK-rs  workflow=release.yml  env=(none)

  jvm-jars:
    name: JVM JARs (Java + Kotlin)
    needs: [prepare, libraries]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - uses: actions/download-artifact@v4
        with:
          path: native

      # Each artifact directory is named after its platform, which is exactly
      # the resource layout the JVM loaders expect. Stage them all so one JAR
      # works on every supported OS/CPU.
      - name: Stage every platform's library
        run: |
          set -euo pipefail
          for dir in native/ilink-sdk-*; do
            platform="$(basename "$dir" | sed 's/^ilink-sdk-//')"
            for binding in java kotlin; do
              dest="bindings/$binding/src/main/resources/io/ilink/sdk/native/$platform"
              mkdir -p "$dest"
              find "$dir" -maxdepth 1 -type f \( -name '*.dll' -o -name '*.so' -o -name '*.dylib' \) \
                -exec cp {} "$dest/" \;
            done
          done
          find bindings/java/src/main/resources bindings/kotlin/src/main/resources -type f

      - name: Build the Java JAR
        run: mvn -B -f bindings/java/pom.xml package

      - name: Publish the Java JAR to Maven Central
        if: needs.prepare.outputs.publish == 'true'
        continue-on-error: true
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${MAVEN_USERNAME:-}" ]; then
            echo "::notice::MAVEN_CENTRAL_USERNAME not set; skipping Maven Central"
            exit 0
          fi
          mvn -B -Prelease -f bindings/java/pom.xml deploy

      - name: Build the Kotlin JAR
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/kotlinc.zip \
              https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip
          unzip -q /tmp/kotlinc.zip -d /tmp
          curl -sSL -o /tmp/jna.jar \
              https://repo1.maven.org/maven2/net/java/dev/jna/jna/5.14.0/jna-5.14.0.jar
          mkdir -p /tmp/kout
          /tmp/kotlinc/bin/kotlinc -cp /tmp/jna.jar -d /tmp/kout \
              $(find bindings/kotlin/src/main/kotlin -name '*.kt')
          cp -r bindings/kotlin/src/main/resources/* /tmp/kout/
          mkdir -p bindings/kotlin/build
          jar cf "bindings/kotlin/build/ilink-sdk-kotlin-${VERSION}.jar" -C /tmp/kout .
          ls -la bindings/kotlin/build/*.jar

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Publish the Kotlin JAR to Maven Central
        if: needs.prepare.outputs.publish == 'true'
        continue-on-error: true
        env:
          ORG_GRADLE_PROJECT_centralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_centralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GPG_SIGNING_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          GPG_SIGNING_PASSWORD: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${ORG_GRADLE_PROJECT_centralUsername:-}" ]; then
            echo "::notice::MAVEN_CENTRAL_USERNAME not set; skipping Maven Central"
            exit 0
          fi
          # Releases go through the Central Portal publisher API, which is what
          # nmcp drives. A plain PUT to the maven-releases repository returns
          # 404.
          gradle -p bindings/kotlin publishAggregationToCentralPortal

      - uses: actions/upload-artifact@v4
        with:
          name: jvm-jars
          path: |
            bindings/java/target/*.jar
            bindings/kotlin/build/*.jar
          if-no-files-found: error

  # crates.io is the only registry that is pure Rust, so it publishes the crate
  # itself (the Rust API, the C ABI and the CLI).
  #
  # crates.io requires the *first* version of a crate to be published with an
  # API token; trusted publishing only works once the crate exists. So this job
  # uses CARGO_REGISTRY_TOKEN when the secret is set (bootstrap, and any release
  # where you prefer a token) and otherwise falls back to OIDC.
  crates-io:
    name: Publish to crates.io
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      # Secrets cannot be read inside `if:`; expose it as an env var instead.
      BOOTSTRAP_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Only meaningful once the crate exists and a trusted publisher is
      # configured at https://crates.io/crates/ilink-sdk/settings
      # (owner=x500x, repo=iLink-SDK-rs, workflow=release.yml).
      - name: Authenticate with crates.io (trusted publishing)
        id: auth
        if: needs.prepare.outputs.publish == 'true' && env.BOOTSTRAP_TOKEN == ''
        continue-on-error: true
        uses: rust-lang/crates-io-auth-action@v1.0.5

      - name: Publish
        # Do not let a crates.io failure block the GitHub release.
        continue-on-error: true
        env:
          OIDC_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          if [ "${{ needs.prepare.outputs.publish }}" != "true" ]; then
            echo "::notice::dry-run (publish not requested)"
            cargo publish --dry-run --allow-dirty
            exit 0
          fi
          token="${BOOTSTRAP_TOKEN:-${OIDC_TOKEN:-}}"
          if [ -z "$token" ]; then
            echo "::notice::no crates.io credentials; running a dry-run instead"
            cargo publish --dry-run --allow-dirty
            exit 0
          fi
          CARGO_REGISTRY_TOKEN="$token" cargo publish --allow-dirty

  # Every registry step is `continue-on-error` so a hiccup there cannot block
  # the GitHub release (the Go download fallback and the C/C++ archives depend
  # on it). That would otherwise let a release go green while nothing was
  # actually published, so this job re-checks each registry afterwards and
  # fails loudly if an artifact is missing.
  verify:
    name: Verify published artifacts
    needs: [prepare, pypi, jvm-jars, crates-io]
    if: always() && needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Check every registry
        run: |
          set -uo pipefail
          version="$VERSION"
          failed=0

          check() {
            local label="$1" url="$2"
            local code
            # crates.io answers 403 to requests without a User-Agent.
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 \
              -H 'User-Agent: ilink-sdk-release-check' "$url" || echo 000)"
            if [ "$code" = "200" ]; then
              echo "  ok       $label"
            else
              echo "::error::$label is not published (HTTP $code): $url"
              failed=1
            fi
          }

          echo "Checking version $version"
          check "crates.io" "https://crates.io/api/v1/crates/ilink-sdk/$version"
          check "PyPI" "https://pypi.org/pypi/ilink-sdk/$version/json"
          check "Maven (Java)" \
            "https://repo1.maven.org/maven2/io/github/x500x/ilink-sdk/$version/ilink-sdk-$version.pom"
          check "Maven (Kotlin)" \
            "https://repo1.maven.org/maven2/io/github/x500x/ilink-sdk-kotlin/$version/ilink-sdk-kotlin-$version.pom"

          # Central takes a few minutes to mirror to repo1; retry that pair.
          if [ "$failed" = "1" ]; then
            echo "Waiting for Maven Central to mirror, then retrying..."
            sleep 120
            failed=0
            check "Maven (Java)" \
              "https://repo1.maven.org/maven2/io/github/x500x/ilink-sdk/$version/ilink-sdk-$version.pom"
            check "Maven (Kotlin)" \
              "https://repo1.maven.org/maven2/io/github/x500x/ilink-sdk-kotlin/$version/ilink-sdk-kotlin-$version.pom"
          fi

          exit "$failed"

  release:
    name: Publish GitHub release
    needs: [prepare, libraries, python-wheels, jvm-jars]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package archives
        run: |
          set -euo pipefail
          mkdir -p release
          release_dir="$PWD/release"
          for dir in artifacts/ilink-sdk-*/; do
            name="$(basename "$dir")"
            (cd "$dir" && zip -r "$release_dir/${name}.zip" .)
          done
          # Wheels and JARs are attached as-is.
          find artifacts -name '*.whl' -exec cp {} release/ \;
          find artifacts -name '*.jar' -exec cp {} release/ \;
          ls -la release

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true

      # Go modules that live in a subdirectory need a tag of the form
      # `bindings/go/vX.Y.Z` for `go get` to resolve them. Create it pointing at
      # the same commit as the release tag.
      - name: Tag the Go submodule
        run: |
          set -euo pipefail
          git tag "bindings/go/${GITHUB_REF_NAME}" "${GITHUB_SHA}"
          git push origin "bindings/go/${GITHUB_REF_NAME}"
