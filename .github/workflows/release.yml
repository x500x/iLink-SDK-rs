name: Release

# A tag push (`v*`) builds everything and publishes to every registry
# automatically. A manual run builds the artifacts and only publishes when the
# `publish` input is checked.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Also publish to crates.io / PyPI / Maven Central"
        type: boolean
        default: false

permissions:
  contents: write
  # Required for OIDC trusted publishing to PyPI and crates.io.
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Derive the version from the tag (or Cargo.toml) and make every manifest
  # agree, so the crate, wheels and JARs are all published with the same number.
  prepare:
    name: Prepare version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve and sync the version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            publish=true
          else
            version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
            publish="${{ inputs.publish }}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          python bindings/scripts/set_version.py "$version"
          python bindings/scripts/set_version.py --check
          echo "releasing $version (publish=$publish)"

      # A tag release must not silently publish a different version than the
      # one committed in the tree.
      - name: Fail if the tag and Cargo.toml disagree
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          declared="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          if [ "$declared" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::tag v${{ steps.version.outputs.version }} but Cargo.toml says $declared"
            exit 1
          fi

  libraries:
    name: Libraries (${{ matrix.artifact }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x86_64
            target: x86_64-unknown-linux-gnu
            cross: false
          - os: ubuntu-latest
            artifact: linux-aarch64
            target: aarch64-unknown-linux-gnu
            cross: true
          - os: macos-latest
            artifact: macos-aarch64
            target: aarch64-apple-darwin
            cross: false
          - os: macos-latest
            artifact: macos-x86_64
            target: x86_64-apple-darwin
            cross: false
          - os: windows-latest
            artifact: windows-x86_64
            target: x86_64-pc-windows-msvc
            cross: false
          - os: windows-latest
            artifact: windows-aarch64
            target: aarch64-pc-windows-msvc
            cross: false
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # `cross` (Docker) is used for the non-native Linux target; the macOS and
      # Windows targets are built natively with the runner toolchains.
      - uses: taiki-e/install-action@cross
        if: matrix.cross

      - name: Build release libraries
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Stage artifacts (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          libdir="target/${{ matrix.target }}/release"
          if [ "${{ runner.os }}" = "macOS" ]; then
            # Make the dylib relocatable so it can be bundled into an app.
            install_name_tool -id "@rpath/libilink_sdk.dylib" \
              "$libdir/libilink_sdk.dylib"
            cp "$libdir/libilink_sdk.dylib" dist/
            cp "$libdir/libilink_sdk.a" dist/
          else
            cp "$libdir/libilink_sdk.so" dist/
            cp "$libdir/libilink_sdk.a" dist/
          fi
          cp include/ilink_sdk.h dist/

      - name: Stage artifacts (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $lib = "target/${{ matrix.target }}/release"
          Copy-Item "$lib/ilink_sdk.dll" dist/
          Copy-Item "$lib/ilink_sdk.dll.lib" dist/
          Copy-Item "$lib/ilink_sdk.lib" dist/
          Copy-Item include/ilink_sdk.h dist/

      - uses: actions/upload-artifact@v4
        with:
          name: ilink-sdk-${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  python-wheels:
    name: Python wheel (${{ matrix.artifact }})
    needs: [prepare, libraries]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x86_64
          - os: macos-13
            artifact: macos-x86_64
          - os: macos-latest
            artifact: macos-aarch64
          - os: windows-latest
            artifact: windows-x86_64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: ilink-sdk-${{ matrix.artifact }}
          path: native

      - name: Build the wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade build
          python bindings/scripts/set_version.py "${{ needs.prepare.outputs.version }}"
          # Point setup.py at the library built by the `libraries` job.
          lib=$(find native -maxdepth 1 -type f \( -name '*.dll' -o -name '*.so' -o -name '*.dylib' \) | head -n1)
          echo "bundling $lib"
          ILINK_SDK_LIB="$lib" python -m build --wheel bindings/python

      - name: Verify the wheel bundles the library
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob, zipfile
          wheel = glob.glob("bindings/python/dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          native = [n for n in names if n.endswith((".so", ".dylib", ".dll"))]
          assert native, f"no native library in {wheel}: {names}"
          print(f"{wheel} bundles {native}")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.artifact }}
          path: bindings/python/dist/*.whl
          if-no-files-found: error

      - name: Publish to PyPI
        if: needs.prepare.outputs.publish == 'true'
        # A registry hiccup must not block the GitHub release, which is what the
        # Go download fallback and the C/C++ archives depend on.
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: bindings/python/dist
          skip-existing: true
          # No token: PyPI trusted publishing (OIDC) authenticates via the
          # `id-token: write` permission. Configure the trusted publisher once
          # at https://pypi.org/manage/account/publishing/ with:
          #   owner=x500x  repo=iLink-SDK-rs  workflow=release.yml  env=(none)

  jvm-jars:
    name: JVM JARs (Java + Kotlin)
    needs: [prepare, libraries]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - uses: actions/download-artifact@v4
        with:
          path: native

      # Each artifact directory is named after its platform, which is exactly
      # the resource layout the JVM loaders expect. Stage them all so one JAR
      # works on every supported OS/CPU.
      - name: Stage every platform's library
        run: |
          set -euo pipefail
          for dir in native/ilink-sdk-*; do
            platform="$(basename "$dir" | sed 's/^ilink-sdk-//')"
            for binding in java kotlin; do
              dest="bindings/$binding/src/main/resources/io/ilink/sdk/native/$platform"
              mkdir -p "$dest"
              find "$dir" -maxdepth 1 -type f \( -name '*.dll' -o -name '*.so' -o -name '*.dylib' \) \
                -exec cp {} "$dest/" \;
            done
          done
          find bindings/java/src/main/resources bindings/kotlin/src/main/resources -type f

      - name: Build the Java JAR
        run: mvn -B -f bindings/java/pom.xml package

      - name: Publish the Java JAR to Maven Central
        if: needs.prepare.outputs.publish == 'true'
        continue-on-error: true
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${MAVEN_USERNAME:-}" ]; then
            echo "::notice::MAVEN_CENTRAL_USERNAME not set; skipping Maven Central"
            exit 0
          fi
          mvn -B -Prelease -f bindings/java/pom.xml deploy

      - name: Build the Kotlin JAR
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/kotlinc.zip \
              https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip
          unzip -q /tmp/kotlinc.zip -d /tmp
          curl -sSL -o /tmp/jna.jar \
              https://repo1.maven.org/maven2/net/java/dev/jna/jna/5.14.0/jna-5.14.0.jar
          mkdir -p /tmp/kout
          /tmp/kotlinc/bin/kotlinc -cp /tmp/jna.jar -d /tmp/kout \
              $(find bindings/kotlin/src/main/kotlin -name '*.kt')
          cp -r bindings/kotlin/src/main/resources/* /tmp/kout/
          mkdir -p bindings/kotlin/build
          jar cf "bindings/kotlin/build/ilink-sdk-kotlin-${VERSION}.jar" -C /tmp/kout .
          ls -la bindings/kotlin/build/*.jar

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Publish the Kotlin JAR to Maven Central
        if: needs.prepare.outputs.publish == 'true'
        continue-on-error: true
        env:
          ORG_GRADLE_PROJECT_centralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_centralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GPG_SIGNING_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          GPG_SIGNING_PASSWORD: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${ORG_GRADLE_PROJECT_centralUsername:-}" ]; then
            echo "::notice::MAVEN_CENTRAL_USERNAME not set; skipping Maven Central"
            exit 0
          fi
          gradle -p bindings/kotlin publish

      - uses: actions/upload-artifact@v4
        with:
          name: jvm-jars
          path: |
            bindings/java/target/*.jar
            bindings/kotlin/build/*.jar
          if-no-files-found: error

  # crates.io is the only registry that is pure Rust, so it publishes the crate
  # itself (the Rust API, the C ABI and the CLI).
  crates-io:
    name: Publish to crates.io
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Trusted publishing: exchange the GitHub OIDC token for a short-lived
      # crates.io token. Configure it once at
      # https://crates.io/settings/tokens -> "Trusted Publishing" with
      #   owner=x500x  repo=iLink-SDK-rs  workflow=release.yml
      - name: Authenticate with crates.io
        id: auth
        if: needs.prepare.outputs.publish == 'true'
        uses: rust-lang/crates-io-auth-action@v1.0.5

      - name: Publish
        # Do not let a crates.io failure block the GitHub release.
        continue-on-error: true
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          if [ "${{ needs.prepare.outputs.publish }}" != "true" ]; then
            echo "::notice::dry-run (publish not requested)"
            cargo publish --dry-run --allow-dirty
          elif [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::notice::no crates.io token; running a dry-run instead"
            cargo publish --dry-run --allow-dirty
          else
            cargo publish --allow-dirty
          fi

  release:
    name: Publish GitHub release
    needs: [prepare, libraries, python-wheels, jvm-jars]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package archives
        run: |
          set -euo pipefail
          mkdir -p release
          release_dir="$PWD/release"
          for dir in artifacts/ilink-sdk-*/; do
            name="$(basename "$dir")"
            (cd "$dir" && zip -r "$release_dir/${name}.zip" .)
          done
          # Wheels and JARs are attached as-is.
          find artifacts -name '*.whl' -exec cp {} release/ \;
          find artifacts -name '*.jar' -exec cp {} release/ \;
          ls -la release

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true

      # Go modules that live in a subdirectory need a tag of the form
      # `bindings/go/vX.Y.Z` for `go get` to resolve them. Create it pointing at
      # the same commit as the release tag.
      - name: Tag the Go submodule
        run: |
          set -euo pipefail
          git tag "bindings/go/${GITHUB_REF_NAME}" "${GITHUB_SHA}"
          git push origin "bindings/go/${GITHUB_REF_NAME}"
