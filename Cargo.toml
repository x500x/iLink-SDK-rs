[package]
name = "openclaw-weixin"
version = "2.4.10"
edition = "2021"
rust-version = "1.82"
description = "Rust SDK for the Tencent Weixin (iLink) backend protocol: QR-code login, long-poll messaging, CDN media upload/download."
readme = "README.md"
authors = ["Tencent"]
license = "MIT"
repository = "https://github.com/Tencent/openclaw-weixin"
keywords = ["weixin", "ilink", "im", "sdk", "bot"]
categories = ["api-bindings", "network-programming"]
exclude = ["/.github/"]

[lib]
name = "openclaw_weixin"
path = "src/lib.rs"

[[bin]]
name = "weixin"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:clap", "dep:qrcode", "dep:directories", "dep:tracing-subscriber"]

[dependencies]
# async runtime
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "macros", "time", "sync", "fs", "io-util", "net", "process", "signal"] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
futures = { version = "0.3", default-features = false }
async-trait = "0.1"

# http / tls
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.6"
url = "2"
percent-encoding = "2"

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# crypto
aes = "0.8"
md-5 = "0.10"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
rand = "0.9"

# errors / logging
thiserror = "2"
anyhow = "1"
tracing = "0.1"

# persistence
rusqlite = { version = "0.37", features = ["bundled"] }

# cli (optional)
clap = { version = "4", features = ["derive", "env", "wrap_help"], optional = true }
qrcode = { version = "0.14", default-features = false, optional = true }
directories = { version = "5", optional = true }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi", "std"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"
wiremock = "0.6"

[profile.release]
lto = true
codegen-units = 1
strip = true
